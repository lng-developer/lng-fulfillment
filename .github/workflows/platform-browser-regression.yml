name: Platform Browser Regression

on:
  workflow_dispatch:
    inputs:
      confirm_approved_test_db:
        description: "Type APPROVED_TEST_DB to confirm this run uses an approved local/test DB, never production."
        required: true
        type: string

jobs:
  platform-browser-regression:
    name: Platform browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      PLATFORM_TEST_HOST: 127.0.0.1
      PLATFORM_TEST_PORT: 3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.PLATFORM_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PLATFORM_TEST_DIRECT_URL }}
      DEV_ADMIN_PASSWORD: ${{ secrets.PLATFORM_TEST_DEV_ADMIN_PASSWORD }}
      DEV_TEST_PASSWORD: ${{ secrets.PLATFORM_TEST_DEV_TEST_PASSWORD }}
      SESSION_SECRET: ${{ secrets.PLATFORM_TEST_SESSION_SECRET }}
      TENANT_API_KEY_PEPPER: ${{ secrets.PLATFORM_TEST_TENANT_API_KEY_PEPPER }}
      YUN_OMS_LIVE_ENABLED: "false"

    steps:
      - name: Confirm approved test DB
        if: ${{ inputs.confirm_approved_test_db != 'APPROVED_TEST_DB' }}
        run: |
          echo "BLOCKED: confirm_approved_test_db must be APPROVED_TEST_DB."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run platform browser regression
        run: npm run test:platform
